        kind: web
        health: http://under-construction-template:8080/healthz
        domain: artur-rios.tech
        host: placeholder
        checks: []
        environments:
          production: { trigger: branch, branches: master }
      # A fork of woochanleee/project-tree-generator, whose default branch is main; it was a Vercel project.
      - id: file-tree-generator
