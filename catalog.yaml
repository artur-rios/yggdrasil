# The catalog: the environments yggdrasil deploys to, every system it manages, and the applications
# each system is made of. Full reference: docs/catalog.md.
#
# A system is what a user thinks of as one product; an application is one deployable unit of it --
# an API, a web UI, a worker -- with its own repository, release cycle and container. An environment
# is a place applications run (a laptop, a staging host, production), with its own options: how
# applications are exposed, what deploys to it, which Jenkins agent does it.
#
# Everything that has to know "which applications and environments exist" reads this file:
#
#   Jenkins        deploy jobs, agents, and what each push or pull request deploys where
#   Git server     branch rules, required checks and the deploy/<environment> statuses on main
#   deploy.sh      which environments an application has, and their options
#   Status API     what to probe in its host's environments, and how systems group applications
#   Prometheus     scrape targets (through the status API)
#   Console        what it shows (through the status API)
#
# This is the catalog of one installation, this repository's own: replace the systems below, the
# owner and the forge and mirror blocks with your own. Its environments: local on a developer's Docker
# Desktop, deployed by hand; development, homologation and production together on one Linux
# Application Server (README.md, Concepts), where production is always on and the other two run only
# while someone uses them.

# Owner (user or organisation, on the git server) of the application repositories and of this repository.
owner: artur-rios

# This repository's name under the owner: Jenkins loads its pipeline, scripts and stacks from its
# main branch. Default yggdrasil; set it if your fork has another name.
repository: yggdrasil
forge:
  type: forgejo
  url: https://git.techcraftsmen.net
  developers: [claude]
mirror:
  github: artur-rios
  releases: true

# The git server (forge) and its GitHub mirror: the `forge` and `mirror` blocks, right after
# `repository:` above (docs/catalog.md). This installation's git server is Forgejo, on its Linux DevOps
# Server, with every repository pushed to a read-only copy on GitHub. Without a forge block this is a
# GitHub installation, as it was until the move to Forgejo (docs/cutover.md, carried out 2026-10-26).

# Repositories that are not applications: the libraries, the repositories that only run CI or
# publish releases, and yggdrasil itself. Each gets a Jenkins job (its checks; for release: owner-tag,
# the owner's version tags) and the branch rules, but nothing is deployed from it. A repository may be
# an entry here and an application's `repository` too (a library and its docs site): one Jenkins job
# each, one yggdrasil.yml, and at most one of them releases. Reference: docs/catalog.md, Repositories.
#
#   checks             What Jenkins runs and reports on every pull request (and push) of develop and
#                      main (and master, for rules: basic), required there. A job runs only its own entry's checks: each one must be
#                      here, and defined under `checks` in the repository's yggdrasil.yml. With rules:
#                      basic they still run and report, but Forgejo requires none of them (no branch
#                      policy there, as on GitHub): intended.
#   actionsChecks      GitHub Actions job names (Windows, macOS), as GitHub reports them, required on
#                      develop: only jobs that run on every pull request.
#   credentials        The Jenkins credentials its checks may bind.
#   releaseCredentials The Jenkins credentials its release build and finalize step may bind
#                      (release.build and release.finalize: signing keys).
#   release            none (default) | owner-tag: the owner pushes the version tags (`tags`, default
#                      v*) and Jenkins builds the release, or packs and pushes the NuGet packages.
#   rules              release (default): develop, main and release/* protected, as the repositories
#                      with a branch-policy workflow had on GitHub | basic: develop, main and master (a
#                      fork's default branch, checked and protected like main) only.
#
# Where each check, Actions job and credential came from (the GitHub workflow jobs and secrets):
# docs/migration-checklist.md, "Check names" and "Credentials".
repositories:
  # The .NET libraries: tests and coverage on every pull request; the owner's bare version tag (1.2.3)
  # on main packs and pushes to nuget.org from the release agent (nuget-api-key, which no check and no
  # catalog entry ever names). Each one's docs site is the application <library>-docs, below.
  - id: dotnet-configuration
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-data # versions each package apart: ArturRios.Data.Sqlite@3.1.0
    release: owner-tag
    tags: "*@[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-extensions
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-jwt
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-logging
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-mediator
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-messaging
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-output
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-test-util
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-util
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-validation
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release
  - id: dotnet-webapi-util
    release: owner-tag
    tags: "[0-9]*"
    checks: [test, coverage]
    credentials: [reportgenerator-license]
    rules: release

  # CI only: checks, and the branch rules they had on GitHub (release where a branch-policy workflow
  # existed, basic where none did). Nothing is released.
  - id: ai-coding-skills # only its branch policy ran on GitHub
    rules: release
  - id: alexandria-api
    checks: [lint-and-test]
    rules: release
  - id: cerberus-api
    checks: [test, docker]
    credentials: [reportgenerator-license]
    rules: release
  - id: coding-challenge-library
    checks: [test, docker]
    rules: basic
  - id: dotnet-libraries # the libraries' index; its site is the application dotnet-libraries-docs
    checks: [verify]
    rules: basic
  - id: reveal.js # a fork: its default branch is master
    checks: [codespell, build]
    rules: basic

  # Released by their owner's v* tags on main: Jenkins builds the release files (Windows ones through
  # GitHub Actions, release.windows in yggdrasil.yml) and publishes the release.
  - id: alexandria-ui
    checks: [analyze, test, integration, build]
    actionsChecks:
      - Unit and widget tests (windows)
      - Integration (windows)
      - Release build (windows)
      - Sandboxed page engine (linux) # needs user namespaces a Jenkins check container doesn't have
    release: owner-tag
    rules: release
  - id: cerberus-ui # its v* tag build (web, Android, Linux; Windows on Actions) is the release
    checks: [analyze-and-test, generated-drift, web-bundle]
    release: owner-tag
    tags: "v*"
    rules: release
  - id: maestro
    checks: [analyze-test, linux-platform]
    actionsChecks: [windows-platform]
    releaseCredentials: [maestro-signing-key, maestro-signing-public-key]
    release: owner-tag
    rules: release
  - id: orpheus # its docs site is the application orpheus-docs
    checks: [linux]
    actionsChecks: [Windows and the installer]
    releaseCredentials:
      - orpheus-android-keystore
      - orpheus-android-keystore-password
      - orpheus-android-key-alias
      - orpheus-android-key-password
    release: owner-tag
    rules: release
  - id: personal-lab # its site is the application personal-lab-site, deployed on main
    checks: [build] # the site's image, as the Pages build ran on every pull request
    release: owner-tag
    rules: release

  # yggdrasil itself: the owner merges its release pull request and pushes the v* tag, as on GitHub.
  - id: yggdrasil
    checks: [status, console, platform]
    actionsChecks: [Console (Windows)]
    release: owner-tag
    rules: release

# Environments, in promotion order. An application deploys to every one of them, with these options,
# unless it lists its own (see `environments` under an application below).
#
#   mode          proxy: routed by Traefik with TLS, no host ports (stacks/<app>.proxy.yml). Default.
#                 ports: published on the host, no Traefik (stacks/<app>.ports.yml)
#   trigger       manual:  only by hand (scripts/deploy.sh) or "Build with Parameters" in Jenkins
#                 branch:  when a branch matching `branches` is pushed
#                 release: when the release/x.y.z -> main pull request passes its checks.
#                          Release environments deploy one after the other, in this order, and the
#                          pull request is merged and tagged once the last one succeeds.
#   branches      For trigger branch: glob(s), e.g. release/* or [develop, hotfix/*]. Use only *
#                 (it matches / too).
#   agent         Jenkins agent label that deploys here (default: the id). One agent per host:
#                 environments that share a host share its agent (agent: vps below). Jenkins
#                 creates it, when it starts, for trigger branch or release, or when agent is set.
#   approval      true: Jenkins waits for someone to click "Deploy" before deploying here.
#   waitTimeout   Seconds deploy.sh waits for the new containers to be healthy (default 300).
#   keepImages    Images of each application kept for rollback (default 3).
#   checksTimeout For trigger release: seconds to wait for the GitHub checks (default 3600). Only
#                 the application's first release environment's value counts.
#   hostSuffix    Appended to every application's `host` in this environment (default none):
#                 heimdall with -dev is https://heimdall-dev.<DOMAIN>. How several environments
#                 share one host, one DOMAIN, one *.DOMAIN certificate and one *.DOMAIN DNS record.
#                 Lowercase letters, digits and dashes, not ending with a dash.
#   onDemand      true: the environment runs only while it is used. scripts/ygg.sh env start|stop
#                 <environment> turns it on and off; the status API shows its stopped applications
#                 as "stopped", not as a problem; a deploy Jenkins starts by itself (trigger branch)
#                 leaves a stopped application stopped (default false).
#
# Several environments can share one Docker engine: each application runs as the Compose project
# <id>-<environment>, reachable on the Docker networks as <id>.<environment>. One platform stack per
# host serves all of them (ENVIRONMENTS in its platform.env). Reference: docs/catalog.md.
environments:
  # A developer's own machine (Docker Desktop): host ports on 127.0.0.1, no platform stack, deployed
  # by hand with scripts/deploy.sh local <app> <checkout> <version>.
  - id: local
    name: Local
    mode: ports
    trigger: manual

  # The next three share one Application Server, its agent and its DOMAIN; hostSuffix tells their hosts apart.
  - id: development
    name: Development
    trigger: branch
    branches: develop
    agent: vps
    hostSuffix: -dev
    onDemand: true

  - id: homologation
    name: Homologation
    trigger: branch
    branches: release/*
    agent: vps
    hostSuffix: -hml
    onDemand: true

  - id: production
    name: Production
    trigger: release
    agent: vps

# Application fields:
#   id              Also the repository name, the Jenkins job and the stack name. In each
#                   environment the Compose project is <id>-<environment> (heimdall-api-production)
#                   and the network alias other containers reach it by <id>.<environment>
#                   (heimdall-api.production). Lowercase, digits, dashes.
#   name            Display name.
#   kind            api | web | worker | platform -- what the console shows it as.
#   repository      Defaults to id; to none for platform components (kind platform), which are not
#                   deployed by Jenkins but started by platform/compose.yml on every host.
#   health          URL the status API probes over the Docker networks. A 2xx answer is healthy.
#                   Written with the plain id as host: for every application but a platform
#                   component, the status API probes <id>.<environment> in each environment.
#   metrics         host:port Prometheus scrapes, the host qualified the same way. Omit when there
#                   is none.
#   metricsPath     Path of the metrics endpoint when it is not /metrics.
#   host            The console's link, with the environment's hostSuffix, under the host's DOMAIN
#                   (heimdall -> https://heimdall.<domain>, https://heimdall-dev.<domain>). It routes
#                   nothing: stacks/<id>.proxy.yml does, from PUBLIC_HOST in the env file; keep them
#                   equal. Omit for applications that are not public.
#   checks          The checks Jenkins runs and reports, required on develop and main, besides
#                   branch-policy (and, on main, deploy/<environment> for each release environment).
#                   A job runs only its own entry's checks, each defined in the repository's
#                   yggdrasil.yml. Only checks that run on every pull request. In a repository with the
#                   basic rules (a site deployed on main) they run and report but are not required:
#                   intended.
#   actionsChecks   GitHub Actions job names (Windows, macOS) required on develop, as GitHub
#                   reports them.
#   credentials     The Jenkins credentials its checks may bind; releaseCredentials, those its
#                   release build and finalize step may (release.build and release.finalize:
#                   signing keys).
#   domain          The domain a site is served on, when it is not the host's DOMAIN.
#   path            Where under the host a site lives (docs.artur-rios.tech/<repository>).
#   apex            true: the site also answers on the bare domain (which its stack redirects to www).
#   container      Compose project and service to read container state from. project defaults to
#                   the id, and is suffixed with -<environment> like the id (platform components
#                   excepted). Without service, any container of the project matches: set it when
#                   the stack has more than one service.
#   environments    The environments this application deploys to, each optionally overriding
#                   the environment's options. Omitted: every environment, with its defaults.
#                   For example, skip development and ask for approval before production:
#                     environments:
#                       homologation: {}
#                       production: { approval: true }

systems:
  - id: heimdall
    name: Heimdall
    description: Identity and access management
    applications:
      - id: heimdall-api
        name: Heimdall API
        kind: api
        health: http://heimdall-api:8080/healthcheck
        metrics: heimdall-api:9464
        host: heimdall-api
        # check: the OpenAPI document, path-filtered (yggdrasil.yml `paths`: skipped, which passes).
        checks: [test, docker, check]
        credentials: [reportgenerator-license]
      - id: heimdall-ui
        name: Heimdall web
        kind: web
        health: http://heimdall-ui:8080/healthz
        host: heimdall
        checks: [analyze-and-test, api-client-drift, build-web]
        # The Android package of a release is signed on the release agent.
        releaseCredentials:
          - heimdall-ui-android-keystore
          - heimdall-ui-android-keystore-password
          - heimdall-ui-android-key-alias
          - heimdall-ui-android-key-password
      # The API's docs site, from the same repository (one yggdrasil.yml: its deploy takes the coverage
      # report from a check of the API's, deploy.inputs). The repository's Dockerfile is the API's, so
      # the site's is docs.Dockerfile (stacks/heimdall-api-docs.yml).
      - id: heimdall-api-docs
        name: Heimdall API docs
        kind: web
        repository: heimdall-api
        health: http://heimdall-api-docs:8080/healthz
        domain: artur-rios.tech
        host: docs
        path: /heimdall-api
        checks: []
        credentials: [reportgenerator-license] # its deploy runs a check of the API's that binds it
        environments:
          production: { trigger: branch, branches: main }
      - id: heimdall-docs
        name: Heimdall docs
        kind: web
        health: http://heimdall-docs:8080/healthz
        domain: artur-rios.tech
        host: docs
        path: /heimdall-docs
        checks: [build]
        environments:
          production: { trigger: branch, branches: main }

  - id: fortuna
    name: Fortuna
    description: Personal finance
    applications:
      - id: fortuna-api
        name: Fortuna API
        kind: api
        health: http://fortuna-api:8080/healthcheck
        metrics: fortuna-api:9464
        host: fortuna-api
        # native-msrv and native-build: the native core on Linux, path-filtered like check. Its Windows
        # build stays on GitHub Actions, path-filtered too, so it is waited for when it runs and never
        # required (no actionsChecks).
        checks: [test, docker, check, audit, native-msrv, native-build]
        credentials: [reportgenerator-license]
      - id: fortuna-ui
        name: Fortuna web
        kind: web
        health: http://fortuna-ui:8080/healthz
        host: fortuna
        checks:
          [analyze-and-test, api-client-drift, header-drift, bindings-drift]
      - id: fortuna-docs
        name: Fortuna docs
        kind: web
        health: http://fortuna-docs:8080/healthz
        domain: artur-rios.tech
        host: docs
        path: /fortuna-docs
        checks: [build]
        environments:
          production: { trigger: branch, branches: main }

  - id: chimera
    name: Chimera
    description: Local-first developer toolbox
    applications:
      - id: chimera
        name: Chimera web
        kind: web
        health: http://chimera:8080/healthz
        host: chimera
        releaseArtifacts: true
        environments:
          local: {}
          development: {}
          homologation: {}
          production:
            approval: true
        # Cross-platform only gathered the browser, Safari and native results on GitHub: each is
        # required by itself now.
        checks:
          - analyze-and-test
          - browser-tests
          - native-linux
          - container
          - accessibility-performance
          - cleanup-contract
          - generated-library
          - evaluate-projects
          - version-contract
          - build-contract
          - minimal-library
        actionsChecks:
          - Safari
          - Native (windows)
          - Artifact cleanup (windows-latest)
          - Generated NuGet library (windows-latest)
          - .NET project evaluation (windows-latest)
          - Project version editing (windows-latest)
          - .NET build, coverage and process lifecycle (windows-latest)
          - Minimal library contracts (windows-latest)
          - Windows owned terminal lifecycle
        container: { service: web }

  - id: alexandria
    name: Alexandria
    description: Personal library
    applications:
      - id: alexandria-docs
        name: Alexandria docs
        kind: web
        health: http://alexandria-docs:8080/healthz
        domain: artur-rios.tech
        host: docs
        path: /alexandria-docs
        checks: [build]
        environments:
          production: { trigger: branch, branches: main }

  - id: orpheus
    name: Orpheus
    description: Music player
    applications:
      # The repository is the repositories entry orpheus (checks, releases); this is its docs site.
      - id: orpheus-docs
        name: Orpheus docs
        kind: web
        repository: orpheus
        health: http://orpheus-docs:8080/healthz
        domain: artur-rios.tech
        host: docs
        path: /orpheus
        checks: []
        environments:
          production: { trigger: branch, branches: main }

