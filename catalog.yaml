  - id: tech-craftsmen
    name: Tech Craftsmen
    description: The company's page and public services
    applications:
      # Released like an application: release/* deploys homologation, the release pull request production.
      - id: tech-craftsmen-company-page
        name: Company page
        kind: web
        health: http://tech-craftsmen-company-page:8080/healthz
        domain: techcraftsmen.net
        host: www
        apex: true # techcraftsmen.net redirects to www (its stack)
        checks: []
        environments:
          homologation: {}
          production: {}
      # An API: reads GitHub with a read-only token, its application secret (env_file in its stack). A
      # fork, whose default branch is master.
      - id: github-readme-stats
        name: GitHub readme stats
        kind: api
        health: http://github-readme-stats:8080/healthz
        domain: techcraftsmen.net
        host: readme-stats
        checks: [test] # test.yml's job: tests, lint, bench, Prettier (basic rules: not required)
        environments:
          production: { trigger: branch, branches: master }

  # yggdrasil itself, so the console also answers "is the platform up?". Not deployed by Jenkins:
  # scripts/platform.sh runs these.
  - id: yggdrasil
    name: Yggdrasil
    description: Deployment platform
    applications:
      - id: traefik
        name: Traefik
        kind: platform
        health: http://traefik:8082/ping
        metrics: traefik:8082
        container: { project: yggdrasil, service: traefik }
      - id: status
        name: Status API
        kind: platform
        health: http://status:8080/healthz
        container: { project: yggdrasil, service: status }
      - id: console
        name: Console
        kind: platform
        health: http://console:8080/healthz
        host: yggdrasil
        container: { project: yggdrasil, service: console }
      - id: prometheus
        name: Prometheus
        kind: platform
        health: http://prometheus:9090/-/healthy
        metrics: prometheus:9090
        container: { project: yggdrasil, service: prometheus }
      - id: loki
        name: Loki
        kind: platform
        health: http://loki:3100/ready
        metrics: loki:3100
        container: { project: yggdrasil, service: loki }
      - id: alloy
        name: Alloy
        kind: platform
        health: http://alloy:12345/-/ready
        metrics: alloy:12345
        container: { project: yggdrasil, service: alloy }
      - id: grafana
        name: Grafana
        kind: platform
        health: http://grafana:3000/api/health
        metrics: grafana:3000
        host: grafana
        container: { project: yggdrasil, service: grafana }
      - id: jenkins
        name: Jenkins
        kind: platform
        health: http://jenkins:8080/login
        metrics: jenkins:8080
        metricsPath: /prometheus/
        host: jenkins
        # Only the host that runs the controller has it; elsewhere it reports "not deployed".
        container: { project: yggdrasil, service: jenkins }
