# The catalog: the environments yggdrasil deploys to, every system it manages, and the applications
# each system is made of. Full reference: docs/catalog.md.
#
# A system is what a user thinks of as one product; an application is one deployable unit of it --
# an API, a web UI, a worker -- with its own repository, release cycle and container. An environment
# is a place applications run (a laptop, a staging host, production), with its own options: how
# applications are exposed, what deploys to it, which Jenkins agent does it.
#
# Everything that has to know "which applications and environments exist" reads this file:
#
#   Jenkins        deploy jobs, agents, and what each push or pull request deploys where
#   GitHub         rulesets, required checks and the deploy/<environment> statuses on main
#   deploy.sh      which environments an application has, and their options
#   Status API     what to probe in its environment, and how systems group applications
#   Prometheus     scrape targets (through the status API)
#   Console        what it shows (through the status API)
#
# This is the catalog of one installation. Replace the systems below with your own; the
# environments are the ones from docs/examples/docker-desktop-wsl-vps/README.md.

# GitHub owner (user or organisation) of the application repositories and of this repository.
owner: artur-rios

# This repository's name under the owner: Jenkins loads its pipeline, scripts and stacks from its
# main branch. Default yggdrasil; set it if your fork has another name.
repository: yggdrasil

# Environments, in promotion order. An application deploys to every one of them, with these options,
# unless it lists its own (see `environments` under an application below).
#
#   mode          proxy: routed by Traefik with TLS, no host ports (stacks/<app>.proxy.yml)
#                 ports: published on the host, no Traefik (stacks/<app>.ports.yml)
#   trigger       manual:  only by hand (scripts/deploy.sh) or "Build with Parameters" in Jenkins
#                 branch:  when a branch matching `branches` is pushed
#                 release: when the release/x.y.z -> main pull request passes every GitHub check.
#                          Release environments deploy one after the other, in this order, and the
#                          pull request is merged and tagged once the last one succeeds.
#   branches      For trigger branch: glob(s), e.g. release/* or [develop, hotfix/*]. Use only *
#                 (it matches / too).
#   agent         Jenkins agent label that deploys here (default: the id). One agent per host.
#                 Jenkins creates it, when it starts, for trigger branch or release, or when agent
#                 is set.
#   approval      true: Jenkins waits for someone to click "Deploy" before deploying here.
#   waitTimeout   Seconds deploy.sh waits for the new containers to be healthy (default 300).
#   keepImages    Images of each application kept for rollback (default 3).
#   checksTimeout For trigger release: seconds to wait for the GitHub checks (default 3600). Only
#                 the application's first release environment's value counts.
environments:
  - id: development
    name: Development
    mode: ports
    trigger: manual

  - id: homologation
    name: Homologation
    mode: proxy
    trigger: branch
    branches: release/*

  - id: production
    name: Production
    mode: proxy
    trigger: release

# Application fields:
#   id              Also the repository name, the Compose project and the stack name, and the
#                   network alias other containers reach it by. Lowercase, digits, dashes.
#   name            Display name.
#   kind            api | web | worker | platform -- what the console shows it as.
#   repository      Defaults to id; to none for platform components (kind platform), which are not
#                   deployed by Jenkins but started by platform/compose.yml on every host.
#   health          URL the status API probes over the Docker networks. A 2xx answer is healthy.
#   metrics         host:port Prometheus scrapes. Omit when there is none.
#   metricsPath     Path of the metrics endpoint when it is not /metrics.
#   host            The console's link, under the environment's DOMAIN (heimdall ->
#                   https://heimdall.<domain>). It routes nothing: stacks/<id>.proxy.yml does, from
#                   PUBLIC_HOST in the env file; keep them equal. Omit for applications that are not
#                   public.
#   checks          GitHub check names required on develop and main, besides branch-policy (and,
#                   on main, deploy/<environment> for each release environment). Only checks that
#                   run on every pull request.
#   container       Compose project and service to read container state from. project defaults to
#                   the id. Without service, any container of the project matches: set it when the
#                   stack has more than one service.
#   environments    The environments this application deploys to, each optionally overriding
#                   the environment's options. Omitted: every environment, with its defaults.
#                   For example, skip development and ask for approval before production:
#                     environments:
#                       homologation: {}
#                       production: { approval: true }

systems:
  - id: heimdall
    name: Heimdall
    description: Identity and access management
    applications:
      - id: heimdall-api
        name: Heimdall API
        kind: api
        health: http://heimdall-api:8080/healthcheck
        metrics: heimdall-api:9464
        host: heimdall-api
        checks: [test, docker]
      - id: heimdall-ui
        name: Heimdall web
        kind: web
        health: http://heimdall-ui:8080/healthz
        host: heimdall
        checks: [Analyze and test, Regenerate and compare]

  - id: fortuna
    name: Fortuna
    description: Personal finance
    applications:
      - id: fortuna-api
        name: Fortuna API
        kind: api
        health: http://fortuna-api:8080/healthcheck
        metrics: fortuna-api:9464
        host: fortuna-api
        checks: [test, docker, check, audit]
      - id: fortuna-ui
        name: Fortuna web
        kind: web
        health: http://fortuna-ui:8080/healthz
        host: fortuna
        checks:
          - Analyze and test
          - API client matches api/fortuna.json
          - Vendored C header matches the one the API publishes
          - FFI bindings match the vendored header

  # yggdrasil itself, so the console also answers "is the platform up?". Not deployed by Jenkins:
  # scripts/platform.sh runs these.
  - id: yggdrasil
    name: Yggdrasil
    description: Deployment platform
    applications:
      - id: traefik
        name: Traefik
        kind: platform
        health: http://traefik:8082/ping
        metrics: traefik:8082
        container: { project: yggdrasil, service: traefik }
      - id: status
        name: Status API
        kind: platform
        health: http://status:8080/healthz
        container: { project: yggdrasil, service: status }
      - id: console
        name: Console
        kind: platform
        health: http://console:8080/healthz
        host: yggdrasil
        container: { project: yggdrasil, service: console }
      - id: prometheus
        name: Prometheus
        kind: platform
        health: http://prometheus:9090/-/healthy
        metrics: prometheus:9090
        container: { project: yggdrasil, service: prometheus }
      - id: loki
        name: Loki
        kind: platform
        health: http://loki:3100/ready
        metrics: loki:3100
        container: { project: yggdrasil, service: loki }
      - id: alloy
        name: Alloy
        kind: platform
        health: http://alloy:12345/-/ready
        metrics: alloy:12345
        container: { project: yggdrasil, service: alloy }
      - id: grafana
        name: Grafana
        kind: platform
        health: http://grafana:3000/api/health
        metrics: grafana:3000
        host: grafana
        container: { project: yggdrasil, service: grafana }
      - id: jenkins
        name: Jenkins
        kind: platform
        health: http://jenkins:8080/login
        metrics: jenkins:8080
        metricsPath: /prometheus/
        host: jenkins
        # Only the production host runs the controller; elsewhere it reports "not deployed".
        container: { project: yggdrasil, service: jenkins }
