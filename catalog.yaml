        name: Personal blog
        kind: web
        health: http://personal-blog:8080/healthz
        domain: artur-rios.tech
        host: blog
        checks: []
        environments:
          production: { trigger: branch, branches: main }
      # The repository is the repositories entry personal-lab, which the owner's tags release; the site
