# heimdall-ui: the Flutter web build served by nginx (the repository's Dockerfile). The repository has no
# Compose file of its own, so this is the service definition; stacks/heimdall-ui.<mode>.yml adds either
# Traefik (proxy environments) or a host port (ports environments).
#
# The build args are compiled into the JavaScript bundle, so they differ per environment and are
# public: never put a secret in them. That is also why the image is built for each environment
# rather than once -- the same commit, a different bundle, tagged <environment>-<version> by
# scripts/deploy.sh so the environments of one host keep their own images.

services:
  ui:
    build:
      context: ${APP_DIR:?APP_DIR is set by scripts/deploy.sh}
      args:
        # Required: the image refuses to build without it.
        HEIMDALL_API_BASE_URL: ${HEIMDALL_API_BASE_URL:?set HEIMDALL_API_BASE_URL in the env file}
        HEIMDALL_GOOGLE_CLIENT_ID: ${HEIMDALL_GOOGLE_CLIENT_ID:-}
        HEIMDALL_SCOPE_ID: ${HEIMDALL_SCOPE_ID:-}
    image: heimdall-ui:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
