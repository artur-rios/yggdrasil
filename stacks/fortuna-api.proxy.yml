# fortuna-api in proxy environments: an overlay applied on top of the repository's own
# docker-compose.yml by scripts/deploy.sh. It changes how the API is reached, nothing about what it
# runs: no host port (Traefik is the only way in), the edge and telemetry networks, and the routers.
#
# Several environments can run on one host, so everything shared between their containers is named
# after the environment, from YGG_ENVIRONMENT (exported by deploy.sh; a docker compose run without it
# stops, saying so):
#   network alias   fortuna-api.<environment>, e.g. fortuna-api.production, on edge and telemetry
#   Traefik         routers fortuna-api-<environment> and
#                   fortuna-api-<environment>-same-origin, service fortuna-api-<environment>
# The labels are a list, not a mapping, because Compose substitutes variables in values only.
#
# Two routers, one service:
#   PUBLIC_HOST                the API's own host name, for the mobile and desktop clients
#   UI_HOST + /api/            the same API under the web UI's own origin. Every API route already
#                              starts with /api/, so nothing is rewritten: the browser build of
#                              fortuna-ui uses https://<UI_HOST> as its API base URL and needs no CORS
#                              and no preflight requests.
#
# /metrics is on port 9464, which is on neither the router nor the host: Prometheus reaches it over
# the telemetry network as fortuna-api.<environment>:9464.
#
# fortuna-api reaches heimdall-api through its environment's public heimdall-api host, over HTTPS
# and Traefik (FORTUNA_HEIMDALL_BASE_URL=https://heimdall-api-dev.example.com/ in development,
# https://heimdall-api.example.com/ in production): it accepts only an HTTPS URL, so not the plain
# HTTP alias heimdall-api.<environment>, which is for the status API's probes and Prometheus.

services:
  api:
    ports: !reset []
    networks:
      edge:
        aliases: ["fortuna-api.${YGG_ENVIRONMENT:?YGG_ENVIRONMENT is set by scripts/deploy.sh}"]
      telemetry:
        aliases: ["fortuna-api.${YGG_ENVIRONMENT:?YGG_ENVIRONMENT is set by scripts/deploy.sh}"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.fortuna-api-${YGG_ENVIRONMENT}.rule=Host(`${PUBLIC_HOST:?set PUBLIC_HOST in the env file}`)
      - traefik.http.routers.fortuna-api-${YGG_ENVIRONMENT}.entrypoints=websecure
      - traefik.http.routers.fortuna-api-${YGG_ENVIRONMENT}.middlewares=secure-headers@file
      - traefik.http.routers.fortuna-api-${YGG_ENVIRONMENT}.service=fortuna-api-${YGG_ENVIRONMENT}
      - traefik.http.routers.fortuna-api-${YGG_ENVIRONMENT}-same-origin.rule=Host(`${UI_HOST:?set UI_HOST in the env file}`) && PathPrefix(`/api/`)
      - traefik.http.routers.fortuna-api-${YGG_ENVIRONMENT}-same-origin.entrypoints=websecure
      - traefik.http.routers.fortuna-api-${YGG_ENVIRONMENT}-same-origin.middlewares=secure-headers@file
      - traefik.http.routers.fortuna-api-${YGG_ENVIRONMENT}-same-origin.service=fortuna-api-${YGG_ENVIRONMENT}
      - traefik.http.services.fortuna-api-${YGG_ENVIRONMENT}.loadbalancer.server.port=8080

networks:
  edge:
    external: true
  telemetry:
    external: true
