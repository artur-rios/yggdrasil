# heimdall-api in proxy environments: an overlay applied on top of the repository's own
# docker-compose.yml by scripts/deploy.sh. It changes how the API is reached: no host port (Traefik
# is the only way in), the edge and telemetry networks, and the routers. And it adds the API's
# database, which the repository's file leaves to the host (below, "The database").
#
# Several environments can run on one host, so everything shared between their containers is named
# after the environment, from YGG_ENVIRONMENT (exported by deploy.sh; a docker compose run without it
# stops, saying so):
#   network alias   heimdall-api.<environment>, e.g. heimdall-api.production, on edge and telemetry
#   Traefik         routers heimdall-api-<environment>, heimdall-api-<environment>-same-origin and
#                   heimdall-api-<environment>-auth, service heimdall-api-<environment>, and the
#                   middleware heimdall-api-<environment>-auth-limit
# The labels are a list, not a mapping, because Compose substitutes variables in values only.
#
# Three routers, one service:
#   PUBLIC_HOST                the API's own host name, for the mobile and desktop clients
#   UI_HOST + /api/            the same API under the web UI's own origin. Every API route already
#                              starts with /api/, so nothing is rewritten: the browser build of
#                              heimdall-ui uses https://<UI_HOST> as its API base URL and needs no CORS
#                              and no preflight requests.
#   /api/auth/ on either       the credential routes, limited per source before they reach the API:
#   host, any method but GET,  10 a minute, a burst of 10, an IPv6 caller counted by its /56, as the
#   HEAD and OPTIONS           API itself counts. The API's own limit, moved in front of it: a
#                              refused request costs nothing and never reaches an instance, and the
#                              /api/auth/ routes the API leaves unthrottled are bounded too
#                              (heimdall-api's operations.md, "Bounding a distributed flood at the
#                              edge"). The profile and admin pages' GETs under /api/auth/ stay on
#                              the other two routers. The rule excludes the safe methods rather than
#                              naming POST: Traefik matches a method case-sensitively and ASP.NET
#                              does not, so a lowercase `post` must not slip past, as (?i) keeps
#                              /API/Auth/login from slipping past. The longest rule wins, so no
#                              priority. The chain is replaced, not extended, so it repeats
#                              secure-headers@file. Never one global bucket for every source: it
#                              would deny every caller at a lower cost. fortuna-api calls the API
#                              over the alias, not through Traefik, so its users never share this
#                              bucket (stacks/fortuna-api.proxy.yml).
#                              Like the API's own limit, it counts the client address Traefik sees.
#                              With the Cloudflare proxy on (docs/dns.md, A7), every user behind one
#                              Cloudflare egress address shares a bucket. The edge network has no
#                              IPv6 (scripts/platform.sh creates it without), so with an AAAA record
#                              every IPv6 client would reach Traefik through Docker's port proxy as
#                              one gateway address, in one bucket.
#
# /metrics is on port 9464, which is on neither the router nor the host: Prometheus reaches it over
# the telemetry network as heimdall-api.<environment>:9464.
#
# The database: PostgreSQL in its own container, `db`, one per environment, its data in the volume
# heimdall-api-<environment>_db, run by the same rootless engine as the API (docs/hosts.md). The API
# reaches it as `db` on the project's own network (DB_HOST=db in the variables store, and Host=db in
# a whole connection string such as HEIMDALL_MIGRATIONS_CONNECTIONSTRING), which no other project
# joins: it is on neither edge nor telemetry, and it publishes no port. The image's superuser,
# postgres, has DB_SUPERUSER_PASSWORD. The API's own roles (the schema's owner and the role it runs
# as, DB_USER) are made by the restore that fills the volume (docs/cutover.md 5.6a), or, for a new
# environment, by the repository's scripts/sql. The image is pinned to the major version the data was
# written by: 19 is a dump and a restore, not an image update. backup.sh dumps it every night
# (`postgres heimdall-api-<environment>-db-1 postgres` in backup.conf).

services:
  api:
    ports: !reset []
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases: ["heimdall-api.${YGG_ENVIRONMENT:?YGG_ENVIRONMENT is set by scripts/deploy.sh}"]
      telemetry:
        aliases: ["heimdall-api.${YGG_ENVIRONMENT:?YGG_ENVIRONMENT is set by scripts/deploy.sh}"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}.rule=Host(`${PUBLIC_HOST:?set PUBLIC_HOST in the env file}`)
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}.entrypoints=websecure
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}.middlewares=secure-headers@file
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}.service=heimdall-api-${YGG_ENVIRONMENT}
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}-same-origin.rule=Host(`${UI_HOST:?set UI_HOST in the env file}`) && PathPrefix(`/api/`)
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}-same-origin.entrypoints=websecure
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}-same-origin.middlewares=secure-headers@file
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}-same-origin.service=heimdall-api-${YGG_ENVIRONMENT}
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}-auth.rule=(Host(`${PUBLIC_HOST:?set PUBLIC_HOST in the env file}`) || Host(`${UI_HOST:?set UI_HOST in the env file}`)) && PathRegexp(`(?i)^/api/auth/`) && !Method(`GET`) && !Method(`HEAD`) && !Method(`OPTIONS`)
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}-auth.entrypoints=websecure
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}-auth.middlewares=secure-headers@file,heimdall-api-${YGG_ENVIRONMENT}-auth-limit
      - traefik.http.routers.heimdall-api-${YGG_ENVIRONMENT}-auth.service=heimdall-api-${YGG_ENVIRONMENT}
      - traefik.http.middlewares.heimdall-api-${YGG_ENVIRONMENT}-auth-limit.ratelimit.average=10
      - traefik.http.middlewares.heimdall-api-${YGG_ENVIRONMENT}-auth-limit.ratelimit.period=1m
      - traefik.http.middlewares.heimdall-api-${YGG_ENVIRONMENT}-auth-limit.ratelimit.burst=10
      - traefik.http.middlewares.heimdall-api-${YGG_ENVIRONMENT}-auth-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=56
      - traefik.http.services.heimdall-api-${YGG_ENVIRONMENT}.loadbalancer.server.port=8080

  db:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?set DB_SUPERUSER_PASSWORD in the env file}
    # PostgreSQL 18's image keeps its data in /var/lib/postgresql/18/docker: the volume is the parent,
    # so a later major version's directory can sit next to it.
    volumes:
      - db:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    # Over TCP, not the socket: while the image initialises a new volume it runs a server on the
    # socket only, and the API must not start against that one.
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres", "--host", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  db:

networks:
  edge:
    external: true
  telemetry:
    external: true
