# Personal page, personal-page in catalog.yaml: templates/stacks/site-apex-redirect.proxy.yml
# with APPLICATION_ID replaced by its id. The template explains every line; keep the two in step.

services:
  web:
    networks:
      edge:
        aliases: ["personal-page.${YGG_ENVIRONMENT:?YGG_ENVIRONMENT is set by scripts/deploy.sh}"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}.rule=Host(`${YGG_PUBLIC_HOST:?YGG_PUBLIC_HOST is set by scripts/deploy.sh from the catalog; give the application a host and a domain}`)
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}.entrypoints=websecure
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}.middlewares=secure-headers@file
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}.service=personal-page-${YGG_ENVIRONMENT}
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}-apex.rule=Host(`${YGG_APEX_HOST:?YGG_APEX_HOST is set by scripts/deploy.sh from the catalog; give the application a host, a domain and apex true}`)
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}-apex.entrypoints=websecure
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}-apex.middlewares=secure-headers@file,personal-page-${YGG_ENVIRONMENT}-apex
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}-apex.service=personal-page-${YGG_ENVIRONMENT}
      - traefik.http.middlewares.personal-page-${YGG_ENVIRONMENT}-apex.redirectregex.regex=^https?://[^/]+(.*)
      - traefik.http.middlewares.personal-page-${YGG_ENVIRONMENT}-apex.redirectregex.replacement=https://${YGG_PUBLIC_HOST}$${1}
      - traefik.http.middlewares.personal-page-${YGG_ENVIRONMENT}-apex.redirectregex.permanent=true
      # The contact form's route, limited per source before it reaches the site: a public form must not be able to
      # use up the mail quota. An IPv6 caller is counted by its /56. The longest rule wins, so no priority.
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}-contact.rule=Host(`${YGG_PUBLIC_HOST:?YGG_PUBLIC_HOST is set by scripts/deploy.sh}`) && PathRegexp(`(?i)^/api/contact/?$`) && !Method(`GET`) && !Method(`HEAD`) && !Method(`OPTIONS`)
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}-contact.entrypoints=websecure
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}-contact.middlewares=secure-headers@file,personal-page-${YGG_ENVIRONMENT}-contact-limit
      - traefik.http.routers.personal-page-${YGG_ENVIRONMENT}-contact.service=personal-page-${YGG_ENVIRONMENT}
      - traefik.http.middlewares.personal-page-${YGG_ENVIRONMENT}-contact-limit.ratelimit.average=3
      - traefik.http.middlewares.personal-page-${YGG_ENVIRONMENT}-contact-limit.ratelimit.period=10m
      - traefik.http.middlewares.personal-page-${YGG_ENVIRONMENT}-contact-limit.ratelimit.burst=3
      - traefik.http.middlewares.personal-page-${YGG_ENVIRONMENT}-contact-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=56
      - traefik.http.services.personal-page-${YGG_ENVIRONMENT}.loadbalancer.server.port=8080

networks:
  edge:
    external: true
