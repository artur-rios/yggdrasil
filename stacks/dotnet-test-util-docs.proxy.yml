# dotnet-test-util docs, dotnet-test-util-docs in catalog.yaml: templates/stacks/site-path.proxy.yml
# with APPLICATION_ID replaced by its id. The template explains every line; keep the two in step.

services:
  web:
    networks:
      edge:
        aliases: ["dotnet-test-util-docs.${YGG_ENVIRONMENT:?YGG_ENVIRONMENT is set by scripts/deploy.sh}"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.dotnet-test-util-docs-${YGG_ENVIRONMENT}.rule=Host(`${YGG_PUBLIC_HOST:?YGG_PUBLIC_HOST is set by scripts/deploy.sh from the catalog; give the application a host and a domain}`) && (Path(`${YGG_PUBLIC_PATH:?YGG_PUBLIC_PATH is set by scripts/deploy.sh from the catalog; give the application a path}`) || PathPrefix(`${YGG_PUBLIC_PATH}/`))
      - traefik.http.routers.dotnet-test-util-docs-${YGG_ENVIRONMENT}.entrypoints=websecure
      - traefik.http.routers.dotnet-test-util-docs-${YGG_ENVIRONMENT}.middlewares=secure-headers@file
      - traefik.http.services.dotnet-test-util-docs-${YGG_ENVIRONMENT}.loadbalancer.server.port=8080

networks:
  edge:
    external: true
