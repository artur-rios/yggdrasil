# One Prometheus per environment host, so no environment label is needed: the Grafana of that host
# only ever sees its own environment.
#
# Every target comes from catalog.yaml, through the status API's HTTP service discovery (its internal
# port 8081, reachable on the telemetry network only). An application added to the catalog is
# scraped from the next refresh on, with system, app and kind labels. A target whose container is
# not running on this host (Jenkins in homologation, say) just shows as down. Prometheus scrapes
# itself through the same list: it is in the catalog like every other platform component.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: catalog
    http_sd_configs:
      - url: http://status:8081/internal/prometheus/targets
        refresh_interval: 1m

