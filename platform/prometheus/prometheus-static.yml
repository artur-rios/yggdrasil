# The same scrape targets as prometheus.yml, written out, for a host that does not run the status API
# (the dev machine: COMPOSE_PROFILES without apps, so no status service to discover them from).
# scripts/platform.sh picks this file for Prometheus then (PROMETHEUS_CONFIG_FILE). Only the platform
# components, one target each with no environment label: a dev machine runs no application of the
# catalog. They are the entries of the yggdrasil system in catalog.yaml that have `metrics`, with the
# system, app and kind labels the status API's discovery (PrometheusTargets) would give them. Keep
# the two in step when a platform component is added to the catalog.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: catalog
    static_configs:
      - targets: ["traefik:8082"]
        labels: { system: yggdrasil, app: traefik, kind: platform }
      - targets: ["prometheus:9090"]
        labels: { system: yggdrasil, app: prometheus, kind: platform }
      - targets: ["loki:3100"]
        labels: { system: yggdrasil, app: loki, kind: platform }
      - targets: ["alloy:12345"]
        labels: { system: yggdrasil, app: alloy, kind: platform }
      - targets: ["grafana:3000"]
        labels: { system: yggdrasil, app: grafana, kind: platform }
      - targets: ["jenkins:8080"]
        labels: { system: yggdrasil, app: jenkins, kind: platform, __metrics_path__: /prometheus/ }
