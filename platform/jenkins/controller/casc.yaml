# Jenkins Configuration as Code. ${VAR} is read from the controller's environment (platform/compose.yml)
# and ${readFile:...} from a mounted file. Reapplied on every start; Manage Jenkins > Configuration as
# Code > Reload applies an edit without a restart.

jenkins:
  systemMessage: "yggdrasil deploy manager. Configured as code: edit platform/jenkins/controller/casc.yaml and catalog.yaml, not this UI."
  # The controller never builds anything; every stage runs on the agent of the environment it
  # deploys to (one agent per host: environments that share a host share its agent).
  numExecutors: 0
  mode: EXCLUSIVE
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  # Agents are not listed here: init.groovy.d/agents.groovy creates one per distinct `agent` of the
  # environments in catalog.yaml (one per host) on every start.

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

credentials:
  system:
    domainCredentials:
      - credentials:
          # One GitHub App gives Jenkins everything: repository scans, webhooks, checkout, and the
          # installation token the pipeline uses to read checks, set the deploy status, merge, tag
          # and delete branches. The key must be PKCS#8 (see the README).
          - gitHubApp:
              id: "github-app"
              description: "yggdrasil GitHub App"
              appID: "${GITHUB_APP_ID}"
              owner: "${GITHUB_OWNER}"
              privateKey: "${readFile:/run/secrets/github-app.pem}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  timestamper:
    allPipelines: true
  globalLibraries:
    libraries:
      - name: "yggdrasil"
        defaultVersion: "main"
        implicit: false
        allowVersionOverride: false
        includeInChangesets: false
        retriever:
          modernSCM:
            libraryPath: "jenkins/library/"
            scm:
              github:
                repoOwner: "${GITHUB_OWNER}"
                repository: "${YGGDRASIL_REPOSITORY}"
                credentialsId: "github-app"
                traits:
                  - gitHubBranchDiscovery:
                      strategyId: 1

jobs:
  - script: |
      // One multibranch job per application in catalog.yaml (mounted read-only from this
      // repository), so adding an application to the catalog is all it takes to get its job: the
      // next restart or Configuration as Code reload creates it. Platform components (kind
      // platform) are not deployed by Jenkins and get none.
      //
      // Each job only sees the heads that can deploy something:
      //   main, and every `branches` glob of an environment with trigger: branch (release/*, say)
      //   PR-*  -> pull requests; the pipeline acts only on release/x.y.z -> main and is a no-op for
      //            the rest (pull requests into develop show up here too)
      //
      // No Groovy string interpolation (dollar-brace) in this script: Configuration as Code would try
      // to resolve it as one of its own variables.
      def catalog = new org.yaml.snakeyaml.Yaml().load(new File('/etc/jenkins/catalog.yaml').getText('UTF-8'))
      def owner = catalog.owner
      def applications = catalog.systems
        .collectMany { it.applications }
        .findAll { it.kind != 'platform' }
      applications.each { app ->
        def repo = app.repository ?: app.id
        def branchGlobs = catalog.environments.collectMany { environment ->
          def override = app.environments == null ? [:] : app.environments[environment.id]
          if (app.environments != null && !app.environments.containsKey(environment.id)) return []
          def options = environment + (override ?: [:])
          if (options.trigger != 'branch') return []
          options.branches instanceof String ? [options.branches] : (options.branches ?: [])
        }
        def heads = (['main', 'PR-*'] + branchGlobs).unique().join(' ')
        multibranchPipelineJob(app.id) {
          displayName(repo)
          branchSources {
            branchSource {
              source {
                github {
                  id(app.id)
                  repoOwner(owner)
                  repository(repo)
                  repositoryUrl('https://github.com/' + owner + '/' + repo)
                  configuredByUrl(false)
                  credentialsId('github-app')
                  traits {
                    // 3 = all branches: a release branch is built as a branch (its trigger: branch
                    // environments) even while it is the head of a pull request (trigger: release).
                    gitHubBranchDiscovery { strategyId(3) }
                    // 2 = the pull request's head revision, not a merge with main: the release
                    // environments run exactly the commit the branch environments ran.
                    gitHubPullRequestDiscovery { strategyId(2) }
                    headWildcardFilter {
                      includes(heads)
                      excludes('')
                    }
                  }
                }
              }
              buildStrategies {
                buildRegularBranches()
                buildChangeRequests {
                  ignoreTargetOnlyChanges(true)
                  ignoreUntrustedChanges(true)
                }
              }
            }
          }
          factory {
            workflowBranchProjectFactory { scriptPath('Jenkinsfile') }
          }
          orphanedItemStrategy {
            discardOldItems { numToKeep(20) }
          }
          triggers {
            // Webhooks do the real work; a daily rescan is the safety net for a missed delivery.
            periodicFolderTrigger { interval('1d') }
          }
        }
      }
