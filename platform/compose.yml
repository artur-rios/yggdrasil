# The shared platform of one host: the reverse proxy, the observability stack and the Jenkins
# pieces that host runs. The applications are not here -- each is its own Compose project (see
# stacks/ and scripts/deploy.sh) and joins the two external networks this stack routes and scrapes:
#
#   edge       Traefik <-> the applications (and application <-> application, e.g. fortuna-api
#              calling heimdall-api by its alias); the status API probes health endpoints here
#   telemetry  Prometheus <-> everything it scrapes
#
# Both are created by scripts/platform.sh, not by this file, so an application stack can be
# deployed, removed or redeployed without this project owning its network.
#
# One file for homologation and production. What differs is the env file (env/platform.env.example)
# and which profiles COMPOSE_PROFILES turns on:
#
#   production     jenkins,agent   -- the controller and the agent that deploys on the VPS
#   homologation   agent           -- only an agent, connecting out to the controller on the VPS
#
# Development (Docker Desktop) does not run this stack; see the README.
#
#     scripts/platform.sh up

name: yggdrasil

# Variables used only by a profile (Jenkins, agent) are not marked required here, because Compose
# interpolates the whole file whatever the active profiles are: homologation would otherwise have to
# define the controller's GitHub App settings. scripts/platform.sh checks them per profile instead.

x-logging: &logging
  # Docker's default json-file driver never rotates. Alloy reads the same files, so rotation here is
  # what bounds the disk, not Loki's retention.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    logging: *logging
    command:
      - --log.format=json
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --ping=true
      # /ping on the internal metrics port, where the status API probes it; the container health
      # check below uses the same entry point.
      - --ping.entrypoint=metrics

      - --providers.docker=true
      # Nothing is routed unless it opts in with traefik.enable=true.
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.tls.options=default@file
      # One wildcard certificate for the whole environment instead of one per host name. It is what
      # makes DNS-01 worth it: homologation, behind NAT, can never answer an HTTP-01 challenge.
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN:?set DOMAIN in the env file}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}

      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in the env file}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Point at https://acme-staging-v02.api.letsencrypt.org/directory while trying things out:
      # production Let's Encrypt rate-limits failed validations per hour.
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      # Check propagation against Cloudflare itself, not the host's resolver, which on a home
      # network may cache the old answer for longer than the challenge waits.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53

      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true

      - --api.dashboard=true
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN in the env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge
      - telemetry
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=metrics", "--entrypoints.metrics.address=:8082"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth,secure-headers@file
      # htpasswd -nB admin -- single-quote the value in the env file so Compose leaves its $ alone.
      traefik.http.middlewares.dashboard-auth.basicauth.users: ${TRAEFIK_DASHBOARD_USERS:?set TRAEFIK_DASHBOARD_USERS in the env file}

  docker-proxy:
    # The status API reads container state (what runs, which version, is it healthy) through this
    # proxy instead of the Docker socket itself: only GET on /containers is allowed, so a bug or a
    # compromise in the status API cannot start, stop or exec into anything.
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    logging: *logging
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker

  status:
    # Probes every catalog application and serves the console (/api/ under yggdrasil.DOMAIN) and
    # Prometheus' target discovery (port 8081, internal). Contract: docs/status-api.md.
    build: ../status
    image: yggdrasil/status:local
    restart: unless-stopped
    logging: *logging
    environment:
      YGGDRASIL_ENVIRONMENT: ${ENVIRONMENT}
      YGGDRASIL_DOMAIN: ${DOMAIN}
      YGGDRASIL_STATUS_TOKEN: ${YGGDRASIL_STATUS_TOKEN:?set YGGDRASIL_STATUS_TOKEN in the env file -- openssl rand -hex 32}
      YGGDRASIL_STATUS_CORS_ORIGINS: ${YGGDRASIL_STATUS_CORS_ORIGINS:-}
      YGGDRASIL_CATALOG_PATH: /app/catalog.yaml
      YGGDRASIL_DOCKER_URL: http://docker-proxy:2375
    volumes:
      - ../catalog.yaml:/app/catalog.yaml:ro
    networks:
      - edge
      - telemetry
      - docker
    depends_on:
      - docker-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.status.rule: Host(`yggdrasil.${DOMAIN}`) && PathPrefix(`/api/`)
      traefik.http.routers.status.entrypoints: websecure
      traefik.http.routers.status.middlewares: secure-headers@file
      traefik.http.services.status.loadbalancer.server.port: "8080"

  console:
    # The Flutter web console, at yggdrasil.DOMAIN. It calls the status API on its own origin.
    build:
      context: ../console
      args:
        YGGDRASIL_ENVIRONMENTS: ${YGGDRASIL_CONSOLE_ENVIRONMENTS:-}
    image: yggdrasil/console:local
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.console.rule: Host(`yggdrasil.${DOMAIN}`)
      traefik.http.routers.console.entrypoints: websecure
      traefik.http.routers.console.middlewares: secure-headers@file
      traefik.http.services.console.loadbalancer.server.port: "8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    # Not routed and not published: only Grafana reads it, over the telemetry network.
    networks:
      - telemetry

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    logging: *logging
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    networks:
      - telemetry

  alloy:
    # Ships every container's stdout to Loki. The APIs also keep their rolling JSON files in their
    # own volumes; those are the durable copy, this is the searchable one.
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    logging: *logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in the env file}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy/data
    networks:
      - telemetry
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    networks:
      - edge
      - telemetry
    depends_on:
      - prometheus
      - loki
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.middlewares: secure-headers@file
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

  jenkins:
    profiles: [jenkins]
    build: ./jenkins/controller
    image: yggdrasil/jenkins:local
    restart: unless-stopped
    logging: *logging
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /etc/jenkins/casc.yaml
      JENKINS_URL: ${JENKINS_URL:-}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-artur-rios}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
    volumes:
      - ./jenkins/controller/casc.yaml:/etc/jenkins/casc.yaml:ro
      # The Job DSL in casc.yaml creates one deploy job per catalog application.
      - ../catalog.yaml:/etc/jenkins/catalog.yaml:ro
      # The GitHub App private key, converted to PKCS#8 (see the README). Read by casc.yaml.
      - ${GITHUB_APP_KEY_FILE:-/etc/yggdrasil/github-app.pem}:/run/secrets/github-app.pem:ro
      - jenkins:/var/jenkins_home
    networks:
      - edge
      - telemetry
    labels:
      traefik.enable: "true"
      traefik.http.routers.jenkins.rule: Host(`jenkins.${DOMAIN}`)
      traefik.http.routers.jenkins.entrypoints: websecure
      traefik.http.routers.jenkins.middlewares: secure-headers@file
      traefik.http.services.jenkins.loadbalancer.server.port: "8080"

  agent:
    # The only thing on a host that deploys. It drives the host's Docker engine through the socket,
    # so the applications run as siblings of this container, not inside it.
    profiles: [agent]
    build: ./jenkins/agent
    image: yggdrasil/jenkins-agent:local
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      # WebSocket over 443: the agent dials out, so a homologation machine behind NAT needs no
      # inbound port, and the controller needs no TCP agent port.
      JENKINS_URL: ${JENKINS_AGENT_URL:-${JENKINS_URL}}
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_NAME: ${JENKINS_AGENT_NAME:-}
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET:-}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      YGG_SECRETS_DIR: /etc/yggdrasil
    # The agent runs as the image's jenkins user; the socket belongs to the host's docker group.
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Per-environment application env files. Secrets, so on the host only, never in git.
      - ${YGG_SECRETS_DIR:-/etc/yggdrasil}:/etc/yggdrasil:ro
      - agent:/home/jenkins/agent
    networks:
      - edge

networks:
  edge:
    external: true
  telemetry:
    external: true
  # Private to this project: only the status API reaches the Docker proxy.
  docker:
    internal: true

volumes:
  letsencrypt:
  prometheus:
  loki:
  alloy:
  grafana:
  jenkins:
  agent:
