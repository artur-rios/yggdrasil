# The shared platform of one host: the reverse proxy, the observability stack and the Jenkins
# pieces that host runs, serving every environment the host runs (ENVIRONMENTS in its platform.env).
# The applications are not here -- each is its own Compose project per environment,
# <application>-<environment> (see stacks/ and scripts/deploy.sh), and joins the two external
# networks this stack routes and scrapes as <application>.<environment>:
#
#   edge       Traefik <-> the applications (and application <-> application, one API calling
#              another of its own environment by its alias); the status API probes health
#              endpoints here
#   telemetry  Prometheus <-> everything it scrapes
#
# Both are created by scripts/platform.sh, not by this file, so an application stack can be
# deployed, removed or redeployed without this project owning its network.
#
# One file for every host, whether it runs one environment or several (development, homologation
# and production on one VPS, say): one platform per host, never one per environment. What differs is
# the env file (env/platform.env.example) and which profiles COMPOSE_PROFILES turns on:
#
#   apps            the status API, its socket proxy and the console: a host that runs applications
#   forge           Forgejo, the git forge, on the development machine
#   jenkins         the Jenkins controller, on the one host that runs it
#   agent           the Jenkins agent that deploys to this host's engine, dialling out to the controller
#   (none)          the proxy, the observability stack and nothing else
#
# The whole stack runs on the rootless Docker engine of the user who runs scripts/platform.sh, which
# exports that engine's socket as DOCKER_SOCKET and refuses a rootful one.
#
# A ports environment (local, on a developer's Docker Desktop) does not run this stack; see the
# README.
#
#     scripts/platform.sh up

name: yggdrasil

# Variables used only by a profile (Jenkins, agent) are not marked required here, because Compose
# interpolates the whole file whatever the active profiles are: an agent-only host would otherwise have to
# define the controller's GitHub App settings. scripts/platform.sh checks them per profile instead.
# DOCKER_SOCKET, PROMETHEUS_CONFIG_FILE, YGG_TRAEFIK_CONFIG_FILE, YGG_TRAEFIK_CONFIG_HASH,
# YGG_JENKINS_CREDENTIALS_FILE and YGG_JENKINS_CREDENTIALS_HASH are exported by scripts/platform.sh, not set in
# the env file.

x-logging: &logging
  # Docker's default json-file driver never rotates. Alloy reads the same files, so rotation here is
  # what bounds the disk, not Loki's retention.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# The Docker socket is the service user's: whoever can create a container can mount into it anything
# that user can reach (its home, its secrets). So no service that faces the network holds it. Traefik,
# Alloy and the status API each reach Docker through their own wollomatic/socket-proxy, on an internal
# network shared with that one client, and each proxy lets through only the requests its client makes
# (-allowGET, -allowHEAD; every other method is refused). The proxy anchors each pattern itself
# (^pattern$), so an alternation must stay inside a group, and Compose would interpolate a $ in it.
# scripts/test_socket_proxies.py checks these lists.
x-socket-proxy: &socket-proxy
  image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
  restart: unless-stopped
  logging: *logging
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # The image runs as nobody, which cannot open the socket. Root in a container of a rootless engine
  # is the user who owns the socket on the host (and no one else), so this is not host root; the
  # dropped capabilities and the read-only root still apply.
  user: "0:0"
  environment:
    SP_LISTENIP: 0.0.0.0
    SP_LOGJSON: "true"
    SP_ALLOWHEALTHCHECK: "true"
    # Exit when the socket goes away (a Docker engine upgrade), so the restart policy reconnects it.
    SP_WATCHDOGINTERVAL: "60"
    SP_STOPONWATCHDOG: "true"
  volumes:
    - ${DOCKER_SOCKET:?run through scripts/platform.sh}:/var/run/docker.sock:ro
  healthcheck:
    test: ["CMD", "/healthcheck"]
    interval: 15s
    timeout: 5s
    retries: 3

services:
  traefik:
    # v3.6.1 or later: earlier versions ask Docker for API 1.24, which Docker Engine 29 refuses
    # ("client version 1.24 is too old"), and then see no containers, so no routes and no certificate.
    image: traefik:v3.6
    restart: unless-stopped
    logging: *logging
    # The static configuration is a file, rendered by scripts/platform.sh from the platform's settings
    # (scripts/traefik_config.py, which also explains each setting): one wildcard certificate per
    # domain in DOMAIN and EXTRA_DOMAINS cannot be written as flags.
    command:
      - --configFile=/etc/traefik/traefik.yml
    # The DNS provider's credentials (CF_DNS_API_TOKEN for Cloudflare, AWS_* for Route 53, ...),
    # kept out of platform.env so no other container ever sees them. Template: env/acme.env.example.
    # (Rendered by platform.sh from the variables store, or acme.env next to platform.env.)
    env_file:
      - ${YGG_ACME_ENV_FILE:-${YGG_SECRETS_DIR:-/etc/yggdrasil}/acme.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${YGG_TRAEFIK_CONFIG_FILE:?run through scripts/platform.sh}:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge
      - telemetry
      - traefik-docker
    depends_on:
      - traefik-docker-proxy
    healthcheck:
      # Reads the ping entry point from the same file.
      test: ["CMD", "traefik", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      # The hash of traefik.yml (scripts/platform.sh): the file's path is the same at every run, so this
      # is what changes the service's configuration, and makes `up` recreate Traefik, when the file does.
      yggdrasil.traefik-config-hash: ${YGG_TRAEFIK_CONFIG_HASH:?run through scripts/platform.sh}
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik${PLATFORM_HOST_SUFFIX:-}.${DOMAIN}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth,secure-headers@file
      # htpasswd -nB admin -- single-quote the value in the env file so Compose leaves its $ alone.
      traefik.http.middlewares.dashboard-auth.basicauth.users: ${TRAEFIK_DASHBOARD_USERS:?set TRAEFIK_DASHBOARD_USERS in the env file}

  traefik-docker-proxy:
    # Traefik's Docker provider: the API version (/_ping, /version), the container list, each
    # container's inspect (labels, networks and addresses are only there) and the container events
    # that trigger a reload. Read-only, so Traefik can no longer start, exec into or remove anything;
    # the inspect still shows it the containers' environment, which Traefik's provider needs and reads.
    <<: *socket-proxy
    command:
      - -allowfrom=traefik
      - -allowHEAD=/_ping
      - -allowGET=(/v1\.[0-9]+)?/(_ping|version|events|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/json)
    networks:
      - traefik-docker

  docker-proxy:
    # The status API's: the container list (state, health, labels, image, uptime) and nothing else.
    # Not the inspect: it carries every container's environment, i.e. every application's secrets,
    # and the status API answers the internet. Nor logs, archives, exec or any write.
    <<: *socket-proxy
    profiles: [apps]
    command:
      - -allowfrom=status
      - -allowGET=(/v1\.[0-9]+)?/containers/json
    networks:
      - docker

  status:
    # Probes every catalog application of every environment of the host and serves the console
    # (/api/ under yggdrasil.DOMAIN) and Prometheus' target discovery (port 8081, internal).
    # Contract: docs/status-api.md.
    profiles: [apps]
    build: ../status
    image: yggdrasil/status:local
    restart: unless-stopped
    logging: *logging
    environment:
      # The environments this host runs, comma-separated. A platform.env from before 0.5 has only
      # ENVIRONMENT, which counts as a list of one; ENVIRONMENTS wins when both are set.
      YGGDRASIL_ENVIRONMENTS: ${ENVIRONMENTS:-${ENVIRONMENT:-}}
      YGGDRASIL_DOMAIN: ${DOMAIN}
      YGGDRASIL_STATUS_TOKEN: ${YGGDRASIL_STATUS_TOKEN:?set YGGDRASIL_STATUS_TOKEN in the env file -- openssl rand -hex 32}
      YGGDRASIL_STATUS_CORS_ORIGINS: ${YGGDRASIL_STATUS_CORS_ORIGINS:-}
      YGGDRASIL_CATALOG_PATH: /app/catalog.yaml
      YGGDRASIL_DOCKER_URL: http://docker-proxy:2375
    volumes:
      - ../catalog.yaml:/app/catalog.yaml:ro
    networks:
      - edge
      - telemetry
      - docker
    depends_on:
      - docker-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.status.rule: Host(`yggdrasil.${DOMAIN}`) && PathPrefix(`/api/`)
      traefik.http.routers.status.entrypoints: websecure
      traefik.http.routers.status.middlewares: secure-headers@file
      traefik.http.services.status.loadbalancer.server.port: "8080"

  console:
    # The Flutter web console, at yggdrasil.DOMAIN. It calls the status API on its own origin.
    profiles: [apps]
    build:
      context: ../console
      args:
        YGGDRASIL_ENVIRONMENTS: ${YGGDRASIL_CONSOLE_ENVIRONMENTS:-}
    image: yggdrasil/console:local
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.console.rule: Host(`yggdrasil.${DOMAIN}`)
      traefik.http.routers.console.entrypoints: websecure
      traefik.http.routers.console.middlewares: secure-headers@file
      traefik.http.services.console.loadbalancer.server.port: "8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      # platform.sh picks the file: discovery through the status API with the apps profile, else the
      # platform's own targets written out.
      - ./prometheus/${PROMETHEUS_CONFIG_FILE:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    # Not routed and not published: only Grafana reads it, over the telemetry network.
    networks:
      - telemetry

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    logging: *logging
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    networks:
      - telemetry

  alloy:
    # Ships every container's stdout to Loki, labelled with the environment its yggdrasil.environment
    # label names (deploy.sh sets it; platform containers have none). The APIs also keep their rolling
    # JSON files in their own volumes; those are the durable copy, this is the searchable one.
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    logging: *logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy/data
    networks:
      - telemetry
      - alloy-docker
    depends_on:
      - loki
      - alloy-docker-proxy

  alloy-docker-proxy:
    # Alloy's discovery.docker (the container and network lists) and loki.source.docker (each
    # container's inspect, for its TTY setting and state, and its log stream), plus the API version
    # (/_ping). Read-only: logs are what Alloy is for, but it can no longer start or exec anything.
    <<: *socket-proxy
    command:
      - -allowfrom=alloy
      - -allowHEAD=/_ping
      - -allowGET=(/v1\.[0-9]+)?/(_ping|containers/json|networks|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs))
    networks:
      - alloy-docker

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SERVER_ROOT_URL: https://grafana${PLATFORM_HOST_SUFFIX:-}.${DOMAIN}/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    networks:
      - edge
      - telemetry
    depends_on:
      - prometheus
      - loki
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana${PLATFORM_HOST_SUFFIX:-}.${DOMAIN}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.middlewares: secure-headers@file
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

  forgejo:
    # The git forge of the development machine, at git.DOMAIN: the repositories Jenkins builds from.
    # The rootless image, pinned by version and digest (it runs as uid 1000 in the container, i.e. as
    # the service user's subuid on the host, never as root). SQLite, so there is no database to run.
    # Registration is closed and nothing is readable signed out: the accounts are created by hand
    # (`forgejo admin user create`, see env/platform.env.example). It writes its own configuration (app.ini, under the data volume:
    # the rootless image keeps it in /var/lib/gitea/custom/conf), so the filesystem is not read-only.
    # Git over SSH is Forgejo's own server on 2222, published on the host (FORGEJO_SSH_PORT); the web
    # side goes through Traefik. No Docker socket, directly or through a proxy.
    profiles: [forge]
    image: codeberg.org/forgejo/forgejo:16.0.6-rootless@sha256:51b47921660e1ec7127f094208fe06901ba57df4fe6d59fcccc3a2419514a77f
    restart: unless-stopped
    logging: *logging
    environment:
      FORGEJO__server__ROOT_URL: https://git.${DOMAIN}/
      FORGEJO__server__DOMAIN: git.${DOMAIN}
      FORGEJO__server__SSH_DOMAIN: git.${DOMAIN}
      FORGEJO__server__START_SSH_SERVER: "true"
      # What clone URLs show (the host port) and what the server listens on in the container.
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      # Without it the first visit is the install wizard, which anyone could complete.
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__log__MODE: console
      # Where its webhooks may go. Forgejo's default is `external` (public addresses only), which is what
      # the public https://jenkins.DOMAIN of setup.md step 12 needs; `jenkins` adds the controller by its
      # Compose service name on the shared network, so http://jenkins:8080 works as a webhook address too
      # (the other private addresses stay refused).
      FORGEJO__webhook__ALLOWED_HOST_LIST: "external,jenkins"
      # Jenkins runs every check. Forgejo Actions would also run a repository's .github/workflows (when
      # it has no .forgejo/workflows), and with no runner here those jobs would wait on every pull request.
      FORGEJO__actions__ENABLED: "false"
    ports:
      - "${FORGEJO_SSH_PORT:-2222}:2222"
    volumes:
      - forgejo-data:/var/lib/gitea
    networks:
      - edge
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The first start creates the database and the keys.
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.forgejo.rule: Host(`git.${DOMAIN}`)
      traefik.http.routers.forgejo.entrypoints: websecure
      traefik.http.routers.forgejo.middlewares: secure-headers@file
      traefik.http.services.forgejo.loadbalancer.server.port: "3000"

  jenkins:
    profiles: [jenkins]
    build: ./jenkins/controller
    image: yggdrasil/jenkins:local
    restart: unless-stopped
    logging: *logging
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      # The configuration files of this installation's git server, comma-separated: scripts/platform.sh
      # picks them from catalog.yaml (casc.yaml, then casc.forgejo.yaml or casc.github.yaml, and
      # casc.github-app.yaml when the GitHub App is used, casc.github-read.yaml on GitHub when the read-only
      # App is set, casc.nuget.yaml when the NuGet key is, casc.credentials.yaml when JENKINS_CREDENTIALS_DIR
      # holds credentials). The default is GitHub, as without a forge block.
      CASC_JENKINS_CONFIG: ${YGG_CASC_CONFIG:-/etc/jenkins/casc.yaml,/etc/jenkins/casc.github.yaml,/etc/jenkins/casc.github-app.yaml}
      JENKINS_URL: ${JENKINS_URL:-}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      # Both come from catalog.yaml: scripts/platform.sh exports them.
      GITHUB_OWNER: ${GITHUB_OWNER:?run through scripts/platform.sh, which reads it from catalog.yaml}
      YGGDRASIL_REPOSITORY: ${YGGDRASIL_REPOSITORY:-yggdrasil}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # GitHub only, optional: the read-only GitHub App the ci agent checks out with (casc.github-read.yaml).
      GITHUB_READ_APP_ID: ${GITHUB_READ_APP_ID:-}
      # The work directories of the ci and release build agents (agents.groovy makes them the nodes'
      # remote roots): each the YGG_AGENT_WORKDIR of that user's agent.env. Required with this profile
      # (scripts/platform.sh).
      CI_AGENT_WORKDIR: ${CI_AGENT_WORKDIR:-}
      RELEASE_AGENT_WORKDIR: ${RELEASE_AGENT_WORKDIR:-}
      # The git server, from catalog.yaml's forge block (also exported by scripts/platform.sh): its web
      # address and the user the write token belongs to. Unused on GitHub.
      FORGE_URL: ${FORGE_URL:-https://github.com}
      FORGE_JENKINS_USER: ${FORGE_JENKINS_USER:-jenkins}
      # The yggdrasil release tag every pipeline loads the library at; required with this profile
      # (checked by scripts/platform.sh, which compose.yml cannot do for one profile).
      YGGDRASIL_LIBRARY_VERSION: ${YGGDRASIL_LIBRARY_VERSION:-}
    volumes:
      - ./jenkins/controller/casc.yaml:/etc/jenkins/casc.yaml:ro
      - ./jenkins/controller/casc.forgejo.yaml:/etc/jenkins/casc.forgejo.yaml:ro
      - ./jenkins/controller/casc.github.yaml:/etc/jenkins/casc.github.yaml:ro
      - ./jenkins/controller/casc.github-app.yaml:/etc/jenkins/casc.github-app.yaml:ro
      - ./jenkins/controller/casc.github-read.yaml:/etc/jenkins/casc.github-read.yaml:ro
      - ./jenkins/controller/casc.nuget.yaml:/etc/jenkins/casc.nuget.yaml:ro
      # The one Jenkinsfile of the installation, loaded into Config File Provider by casc.yaml: every job
      # runs it, never the repository's own.
      - ../jenkins/Jenkinsfile.default:/etc/jenkins/Jenkinsfile.default:ro
      # The actions-release job's script (casc.yaml's Job DSL reads it), kept in Jenkins the same way.
      - ../jenkins/actions-release.groovy:/etc/jenkins/actions-release.groovy:ro
      # The release-resume job's script, the same way.
      - ../jenkins/release-resume.groovy:/etc/jenkins/release-resume.groovy:ro
      # The tag-check job's script, the same way.
      - ../jenkins/tag-check.groovy:/etc/jenkins/tag-check.groovy:ro
      # The Job DSL in casc.yaml creates one deploy job per catalog application, agents.groovy one
      # agent per host (environments sharing a host share its `agent`), and the pipeline reads each
      # application's environments from it.
      - ../catalog.yaml:/etc/jenkins/catalog.yaml:ro
      - ./jenkins/controller/init.groovy.d/agents.groovy:/var/jenkins_home/init.groovy.d/agents.groovy:ro
      # The GitHub App private key, converted to PKCS#8 (docs/setup.md, 9.1). Read by casc.github-app.yaml.
      - ${GITHUB_APP_KEY_FILE:-/etc/yggdrasil/github-app.pem}:/run/secrets/github-app.pem:ro
      # The read-only GitHub App's key (PKCS#8 too), read by casc.github-read.yaml; /dev/null when unset.
      - ${GITHUB_READ_APP_KEY_FILE:-/dev/null}:/run/secrets/github-read.pem:ro
      # Forgejo's tokens and webhook secret, one file each (env/platform.env.example), read by
      # casc.forgejo.yaml. /dev/null when unset, which is every GitHub installation: a missing file would
      # make Docker create a directory in its place on the host.
      - ${FORGE_WRITE_TOKEN_FILE:-/dev/null}:/run/secrets/forge-write-token:ro
      - ${FORGE_READ_TOKEN_FILE:-/dev/null}:/run/secrets/forge-read-token:ro
      - ${FORGE_WEBHOOK_SECRET_FILE:-/dev/null}:/run/secrets/forge-webhook-secret:ro
      # The nuget.org API key, read by casc.nuget.yaml (the libraries' packages); /dev/null when unset.
      - ${NUGET_API_KEY_FILE:-/dev/null}:/run/secrets/nuget-api-key:ro
      # The repositories' own credentials (JENKINS_CREDENTIALS_DIR, one file per id), and the configuration
      # scripts/platform.sh renders from them, which reads each from this directory; /dev/null for both when
      # there are none.
      - ${YGG_JENKINS_CREDENTIALS_FILE:-/dev/null}:/etc/jenkins/casc.credentials.yaml:ro
      - ${JENKINS_CREDENTIALS_DIR:-/dev/null}:/run/secrets/jenkins-credentials:ro
      - jenkins:/var/jenkins_home
    networks:
      - edge
      - telemetry
    labels:
      # The hash of the repositories' credentials (scripts/platform.sh: the rendered casc.credentials.yaml and
      # each secret file's size and time, never its content). The file's path is the same at every run, so
      # this is what makes `up` recreate the controller, which reads its credentials only when it starts.
      yggdrasil.credentials-hash: ${YGG_JENKINS_CREDENTIALS_HASH:-}
      traefik.enable: "true"
      traefik.http.routers.jenkins.rule: Host(`jenkins.${DOMAIN}`)
      traefik.http.routers.jenkins.entrypoints: websecure
      traefik.http.routers.jenkins.middlewares: secure-headers@file
      traefik.http.services.jenkins.loadbalancer.server.port: "8080"

  agent:
    # The only thing on a host that deploys. It drives the user's Docker engine through the socket,
    # so the applications run as siblings of this container, not inside it.
    profiles: [agent]
    build: ./jenkins/agent
    image: yggdrasil/jenkins-agent:local
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      # WebSocket over 443: the agent dials out, so a host behind NAT needs no
      # inbound port, and the controller needs no TCP agent port.
      JENKINS_URL: ${JENKINS_AGENT_URL:-${JENKINS_URL}}
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_NAME: ${JENKINS_AGENT_NAME:-}
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET:-}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      YGG_SECRETS_DIR: /etc/yggdrasil
      # The platform's domain, which scripts/deploy.sh puts under a site's host (YGG_PUBLIC_HOST) when the
      # application sets no `domain` of its own: the agent is what runs deploy.sh, and DOMAIN is only
      # known to this file.
      YGG_DOMAIN: ${DOMAIN}
    # The image's jenkins user could not open the socket. Root here is the service user on the host
    # (rootless Docker, see x-socket-proxy), so the agent can do what that user can and no more.
    user: "0:0"
    volumes:
      - ${DOCKER_SOCKET:?run through scripts/platform.sh}:/var/run/docker.sock
      # The application env files of every environment of the host (<environment>/<application>.env).
      # Secrets, so on the host only, never in git.
      - ${YGG_SECRETS_DIR:-/etc/yggdrasil}:/etc/yggdrasil:ro
      # Deploy locks (scripts/deploy.sh), shared with deploys by hand on the host: read-write, unlike
      # the rest of the secrets directory.
      - ${YGG_SECRETS_DIR:-/etc/yggdrasil}/locks:/etc/yggdrasil/locks
      - agent:/home/jenkins/agent
    networks:
      - edge

networks:
  edge:
    external: true
  telemetry:
    external: true
  # Private to this project, one per socket proxy and its one client, so no client can reach another's
  # proxy (and its wider allowlist), and none of them reaches the internet.
  docker:
    internal: true
  traefik-docker:
    internal: true
  alloy-docker:
    internal: true

volumes:
  letsencrypt:
  prometheus:
  loki:
  alloy:
  grafana:
  forgejo-data:
  jenkins:
  agent:
