# Serves the Flutter web build of the yggdrasil console. Installed as
# /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged, whose
# nginx.conf supplies the http block.
#
# TLS is terminated by Traefik in front of this container, so this server
# speaks plain HTTP on 8080 and leaves HSTS to the proxy. Traefik also routes
# /api/ on the same host to the status API, so nothing is proxied here.

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    server_tokens      off;
    # Redirects must stay relative: the client reached us over HTTPS on 443
    # through Traefik, not on http://<host>:8080.
    absolute_redirect  off;

    # Types: application/wasm is already mapped by the image's mime.types; .mjs
    # is not. A `types` block here would replace the inherited map outright,
    # so the stock map is re-included first and .mjs is added to it.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json application/wasm
                      image/svg+xml font/ttf font/otf application/x-font-ttf;

    # Liveness probe for the Docker HEALTHCHECK; not logged to keep the access
    # log about real traffic.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        add_header   Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Caching: Flutter emits stable, un-hashed file names (main.dart.js,
    # flutter_bootstrap.js, assets/*, canvaskit/*), so no file can safely be
    # cached as immutable - a long max-age would pin users to a stale build.
    # Every response is therefore `no-cache`: browsers keep a copy but
    # revalidate it with the ETag / Last-Modified validators nginx emits, which
    # costs a 304 round trip per file instead of a full download. This covers
    # index.html, flutter_bootstrap.js, flutter_service_worker.js,
    # version.json and manifest.json as well as everything else.
    #
    # No Content-Security-Policy: CanvasKit needs 'wasm-unsafe-eval', and the
    # console may call other hosts' status APIs (connect-src), so a
    # policy has not been verified against either. X-Frame-Options covers
    # framing.
    #
    # add_header is not inherited into a location that declares its own, so
    # the security headers live in the same block as Cache-Control.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control          "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options        "DENY" always;
    }
}
