name: yggdrasil_console
description: "The yggdrasil deploy console: the status of every system and application in each environment."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  # Some plugins reference CupertinoIcons; without the font the web build warns.
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    # The offline demo: the status API contract's example, expanded.
    - assets/demo/status.json
