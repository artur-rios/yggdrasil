name: Release

# Builds the console's installable apps for a release and attaches them to its GitHub release:
# the Windows installer and the Android APK. The web console is not here -- each environment host
# builds it from this repository (scripts/platform.sh).
#
# Runs when a v* tag is pushed (the tag is created with the GitHub release, after the release pull
# request is merged into main) and on demand for an existing tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Only released code is built: the tag must point at a commit that reached main through a
  # release/* pull request. The tag ruleset already limits who may create v* tags; this also
  # catches a tag the owner put on the wrong commit, and a manual run for such a tag.
  on-main:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${TAG} points at $(git rev-parse --short HEAD), which is not on main. Merge the release/* pull request into main and tag the merge commit."
            exit 1
          fi

  windows:
    name: Windows installer
    needs: on-main
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        shell: pwsh
        run: flutter build windows --release --build-name=$($env:TAG.TrimStart('v'))
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" build/windows/x64/runner/Release
          }
      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$($env:TAG.TrimStart('v'))" windows/installer/yggdrasil.iss
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG (Get-Item build/windows/installer/*.exe).FullName --clobber

  android:
    name: Android APK
    needs: on-main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter build apk --release --build-name=${TAG#v}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "yggdrasil-console-${TAG#v}.apk"
          gh release upload "$TAG" "yggdrasil-console-${TAG#v}.apk" --clobber
