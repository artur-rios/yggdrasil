name: CI

# Build and test for everything in this repository. Deployment is not here: the platform is brought
# up on each host with scripts/platform.sh, and applications are deployed by Jenkins.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    name: Status API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test status --configuration Release
      - name: Build the container image
        run: docker build --tag yggdrasil-status:ci status

  console:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: yggdrasil-console-android
          path: console/build/app/outputs/flutter-apk/app-release.apk

  console-windows:
    name: Console (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle the Visual C++ runtime
        # A Flutter Windows app needs it and not every machine has it; shipping the three DLLs
        # next to the executable is what Flutter's own deployment guide recommends.
        shell: pwsh
        run: |
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" build/windows/x64/runner/Release
          }
      - name: Build the installer
        # Inno Setup 6 is preinstalled on the windows-latest runners.
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" windows/installer/yggdrasil.iss
      - uses: actions/upload-artifact@v6
        with:
          name: yggdrasil-console-windows
          path: console/build/windows/installer/*.exe

  platform:
    name: Platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts
        run: shellcheck scripts/*.sh
      - run: pip install --quiet pyyaml
      - name: Test the catalog tooling
        run: python3 -m unittest discover -s scripts -v
      - name: Test the Docker socket proxies against Traefik and Alloy
        # The pinned proxy image with compose.yml's allowlists, in front of a fake Docker API.
        env:
          YGG_DOCKER_TESTS: "1"
        run: python3 -m unittest scripts.test_socket_proxies -v
      - name: Check the catalog
        # The same validation deploy.sh, platform.sh and rulesets.py run before using it.
        run: python3 scripts/catalog.py validate
      - name: Validate the Compose files
        run: |
          secrets=$(mktemp -d)
          cat > "$secrets/platform.env" <<ENV
          ENVIRONMENTS=$(python3 scripts/catalog.py environments | paste -sd, -)
          DOMAIN=example.com
          ACME_EMAIL=ci@example.com
          ACME_DNS_PROVIDER=cloudflare
          TRAEFIK_DASHBOARD_USERS='admin:x'
          GRAFANA_ADMIN_PASSWORD=x
          YGGDRASIL_STATUS_TOKEN=0000000000000000000000000000000000000000
          DOCKER_GID=999
          YGG_SECRETS_DIR=$secrets
          ENV
          touch "$secrets/acme.env"
          GITHUB_OWNER=$(python3 scripts/catalog.py owner) \
            docker compose --env-file "$secrets/platform.env" -f platform/compose.yml config --quiet
          # Every stack that has its service here, in both modes, with a dummy value for each
          # variable it requires. (Stacks based on the application's own docker-compose.yml are
          # validated by deploy.sh on the first deploy.)
          for stack in $(python3 scripts/catalog.py applications --deployable); do
            [[ -f "stacks/$stack.yml" ]] || continue
            for mode in proxy ports; do
              [[ -f "stacks/$stack.$mode.yml" ]] || continue
              paths=("stacks/$stack.yml" "stacks/$stack.$mode.yml")
              grep -ohE '[$][{][A-Z_]+' "${paths[@]}" | cut -c3- | sort -u \
                | sed -E 's/^(.*PORT)$/\1=127.0.0.1:18080/; t; s/$/=x/' > "$secrets/$stack.env"
              APP_DIR=. docker compose --env-file "$secrets/$stack.env" -f "${paths[0]}" -f "${paths[1]}" config --quiet
              echo "stacks/$stack.$mode.yml ok"
            done
          done
