name: Pipeline (live Jenkins)

# The pipeline end to end: the Jenkins controller and build agent images built from platform/jenkins, Forgejo,
# pull requests and pushes through the library (scripts/test_jenkins_live.py). It builds images (the plugins come
# from the internet) and runs builds, so it runs only when started by hand, on the GitHub copy. It is not a check:
# neither Jenkins nor the branch rules wait for it.

on:
  workflow_dispatch:

jobs:
  pipeline-live:
    name: Pipeline (live Jenkins)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet pyyaml
      - name: Run the pipeline against Jenkins and Forgejo
        env:
          YGG_JENKINS_TESTS: "1"
        run: python3 -m unittest discover -s scripts -p test_jenkins_live.py -v
